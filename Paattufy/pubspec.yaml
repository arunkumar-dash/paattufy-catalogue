name: paattufy
description: "Paattufy — an offline-first music player for a personal library."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  archive: ^4.3.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  dio: ^5.11.1
  drift: ^2.35.0
  fftea: ^1.5.0+1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  home_widget: ^0.10.0
  html: ^0.15.7
  just_audio: ^0.10.6
  package_info_plus: ^10.2.1
  paattufy_native:
    path: packages/paattufy_native
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  tflite_flutter: ^0.12.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#8B3DFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 36

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon_foreground.png
    - assets/models/yamnet.tflite
